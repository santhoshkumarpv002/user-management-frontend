<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="d-flex align-items-center justify-content-center mt-4" style="margin-top: 400px;">



        <div class="card text-center" style="width: 300px;">
            <div class="alert alert-danger alert-dismissible fade show" role="alert" *ngIf="msgShow">
                <small>{{msg}}</small>
            </div>
            <div class="card-header h5 text-white bg-primary">Password Reset</div>
            <div class="card-body px-5">

                <div *ngIf="isMail">
                    <p class="card-text py-2">
                        Enter your email address and we'll send you an email with instructions to reset your password.
                    </p>

                    <div data-mdb-input-init class="form-outline">
                        <input type="email" id="typeEmail" class="form-control my-3" name="email" [(ngModel)]="email" />
                        <label class="form-label" for="typeEmail">Email input</label>
                    </div>
                    <button data-mdb-ripple-init class="btn btn-primary w-100" (click)="handleResetPassword()">Reset
                        password</button>
                </div>
                <div *ngIf="isOtp">
                    <p class="card-text py-0">Check you Mail</p>

                    <div data-mdb-input-init class="form-outline">
                        <label class="form-label" for="typeEmail">Enter OTP</label>
                        <input type="email" id="typeEmail" class="form-control my-3" name="OTP" [(ngModel)]="OTP" />

                    </div>
                    <button data-mdb-ripple-init class="btn btn-primary w-100" (click)="handleOTP()">verify</button>
                </div>

            </div>
            <div *ngIf="showPassword">
                <form>
                    <p class="card-text py-0">Enter New Password</p>

                    <div data-mdb-input-init class="form-outline">
                        <input type="password" id="typeEmails" class="form-control my-3" name="password"
                            [(ngModel)]="password" required min="6" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" />

                    </div>
                    <button data-mdb-ripple-init class="btn btn-primary w-100"
                        (click)="handleUpdatePassword()">update</button>
                </form>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a class="" [routerLink]="['/login']">Login</a>
                <a class="" [routerLink]="['/register']">Register</a>
            </div>

        </div>
    </div>


</body>

</html>
