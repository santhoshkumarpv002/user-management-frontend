

    <div class="container">
        <div class="row">
          <div class="col">
            <section class="vh-100">
                <div class="container py-5 h-100">
                  <div class="row d-flex align-items-center justify-content-center h-100">
                    <div class="col-md-8 col-lg-7 col-xl-6">
                      <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.svg"
                        class="img-fluid" alt="Phone image">
                    </div>
                    <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">
                      <form>
                        <div class="alert alert-danger" role="alert" *ngIf="invalid">
                          <small>{{errorMessage}}</small><br>
                        </div>
                        <!-- Email input -->
                        <div data-mdb-input-init class="form-outline mb-4">
                          <label class="form-label text-bold fw-bold" for="form1Example13">Email</label>
                          <input type="email" id="form1Example13" class="form-control form-control-lg" name="id" [(ngModel)]="email" />
                          
                          
                        </div>
              
                        <!-- Password input -->
                        <div data-mdb-input-init class="form-outline mb-4">
                          <label class="form-label  text-bold fw-bold" for="form1Example23">Password</label>
                          <input type="password" id="form1Example23" class="form-control form-control-lg"  name="password" [(ngModel)]="password"/>
                         
                        </div>
              
                       
                       
                        <!-- Submit button -->
                        <button (click)="handleLogin()" type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg btn-block">Sign in</button>

                        
                        <div class="d-flex justify-content-around align-items-center mb-4 mt-2">
                       
                          <a  [routerLink]="['/forgot']" >Forgot password?</a>
                        </div>
                        <div class="d-flex justify-content-around align-items-center mb-4 mt-2">
                       
                          <a  [routerLink]="['/register']" >New User?</a>
                        </div>
              
                      </form>
                    </div>
                  </div>
                </div>
              </section>
        </div>
        </div>
    </div>
